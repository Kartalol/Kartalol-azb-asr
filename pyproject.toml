[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kartalol-azb-asr"
version = "0.1.0"
description = "Training and evaluation code for the South Azerbaijani ASR benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Kartal Ol Foundation"}]
dependencies = [
  "accelerate>=1.1",
  "datasets[audio]>=3.1",
  "librosa>=0.10.2",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "sentencepiece>=0.2",
  "soundfile>=0.12",
  "torch>=2.2",
  "transformers>=4.46,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
