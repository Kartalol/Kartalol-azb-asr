name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Tests
        run: pytest
      - name: Syntax check
        run: python -m compileall -q src scripts tests
      - name: CLI smoke tests
        run: |
          python scripts/train_whisper.py --help
          python scripts/train_mms.py --help
          python scripts/evaluate.py --help
          python scripts/transcribe.py --help
          python scripts/reproduce_benchmark.py --help
