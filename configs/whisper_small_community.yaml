model_id: openai/whisper-small
dataset:
  - community
train_split: "train[:90%]"
eval_split: "train[90%:]"  # TODO: replace with the final paper validation IDs if available.
output_dir: outputs/whisper-small-community
seed: 42  # TODO: original seed not recoverable.
epochs: 10
learning_rate: 0.0001
train_batch_size: 1
eval_batch_size: 8  # TODO: original Small eval batch size was inherited, not explicit.
gradient_accumulation: 1
fp16: true
bf16: false
max_audio_duration: 30.0
generation_max_length: 225
generation_num_beams: 1  # TODO: original generation beam count not recoverable.
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 1
logging_steps: 10
