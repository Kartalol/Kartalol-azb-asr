model_id: openai/whisper-tiny
dataset:
  - community
train_split: "train[:90%]"
eval_split: "train[90%:]"  # TODO: replace with the final paper validation IDs if available.
output_dir: outputs/whisper-tiny-community
seed: 42  # TODO: the original Tiny script did not set a seed; 42 is a reproducible replacement.
epochs: 10
learning_rate: 0.0001
train_batch_size: 8
eval_batch_size: 8  # TODO: not explicit in the original script (Trainer inherited 8).
gradient_accumulation: 1
fp16: true
bf16: false
max_audio_duration: 30.0
generation_max_length: 225
generation_num_beams: 1  # TODO: not explicit; Transformers default was used.
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 1
logging_steps: 10
